name: Batch Log Outcomes

# Prevent overlapping writers from racing to push the forecast archive
concurrency:
  group: blizzard-data-main
  queue: max
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
      default_outcome:
        description: 'Default outcome for all dates'
        required: true
        type: choice
        options:
          - school-open
          - snow-day
          - no-school
        default: school-open
      exceptions:
        description: 'Exceptions JSON: {"2026-01-10": "snow-day"} or leave empty'
        required: false
        type: string
      no_school_reason:
        description: 'If default is no-school, why?'
        required: false
        type: choice
        options:
          - ''
          - weekend
          - thanksgiving
          - winter-break
          - spring-break
          - teacher-day
          - mlk-day
          - presidents-day
          - memorial-day
          - other
      dry_run:
        description: 'Preview without committing'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  batch-record:
    if: github.ref == 'refs/heads/main' && vars.BLIZZARD_AUTOMATION_WRITES_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Load canonical forecast data
        id: snapshot
        run: node build-tools/commit-data.mjs restore
      - name: Update validated ledger
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          DEFAULT_OUTCOME: ${{ inputs.default_outcome }}
          EXCEPTIONS: ${{ inputs.exceptions }}
          NO_SCHOOL_REASON: ${{ inputs.no_school_reason }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node build-tools/update-outcomes-batch.mjs
      - name: Commit data without JSON rebasing
        id: commit
        if: ${{ inputs.dry_run != true }}
        env:
          DATA_BASE: ${{ steps.snapshot.outputs.sha }}
          BLIZZARD_AUTOMATION_WRITES_APPROVED: ${{ vars.BLIZZARD_AUTOMATION_WRITES_APPROVED }}
        run: node build-tools/commit-data.mjs
      - name: Request Pages deployment
        if: steps.commit.outputs.updated == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'deploy.yml', ref: 'main'
            })
