name: Deploy Site
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional full main revision; obsolete requests skip deployment'
        required: false
        type: string
  push:
    branches: [main]
permissions:
  contents: read
# One shared queue covers build and promotion, including requests from data workflows.
concurrency:
  group: blizzard-pages-main
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.BLIZZARD_RELEASE_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      data_sha: ${{ steps.snapshot.outputs.sha }}
      current: ${{ steps.revision.outputs.current }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable main revision
        id: revision
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          TRIGGER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          EXPECTED="$EXPECTED_SHA"
          if [ "$EVENT_NAME" = push ]; then EXPECTED="$TRIGGER_SHA"; fi
          if [ -n "$EXPECTED" ] && ! [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'Expected a full commit SHA'; exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ -n "$EXPECTED" ] && [ "$EXPECTED" != "$SHA" ]; then
            echo 'Obsolete deployment request; a newer main revision exists'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.revision.outputs.current == 'true'
      - name: Load canonical forecast data
        if: steps.revision.outputs.current == 'true'
        id: snapshot
        run: node build-tools/commit-data.mjs restore
      - name: Retrieve pinned release music
        if: steps.revision.outputs.current == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: StevenWangler/blizzard-release-media
          ref: 4c0874d2fb931c727bdf97b315634617769973af
          ssh-key: ${{ secrets.BLIZZARD_MEDIA_DEPLOY_KEY }}
          persist-credentials: false
          path: .local-assets/music
      - name: Verify and build release
        if: steps.revision.outputs.current == 'true'
        env:
          VITE_BLIZZARD_ACTIVE: ${{ vars.BLIZZARD_SEASON_ACTIVE || 'false' }}
          VITE_BLIZZARD_ENV: production
        run: |
          npm run typecheck
          npm test
          npm run build:release
          npm run verify:dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: steps.revision.outputs.current == 'true'
        with:
          name: dist
          path: dist
          retention-days: 1
  deploy:
    needs: build
    if: needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse promotion if main advanced during build
        id: freshness
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DATA_SHA: ${{ needs.build.outputs.data_sha }}
          BUILT_SHA: ${{ needs.build.outputs.sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({ owner: context.repo.owner, repo: context.repo.repo, ref: 'main' });
            const snapshot = await github.rest.git.getRef({ ...context.repo, ref: 'heads/blizzard-data' });
            core.setOutput('current', String(data.sha === process.env.BUILT_SHA && snapshot.data.object.sha === process.env.DATA_SHA));
            if (data.sha !== process.env.BUILT_SHA) core.notice('Main advanced; this artifact will not be published.');
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: steps.freshness.outputs.current == 'true'
        with:
          name: dist
          path: dist
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4
        if: steps.freshness.outputs.current == 'true'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: steps.freshness.outputs.current == 'true'
        with:
          path: dist
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        if: steps.freshness.outputs.current == 'true'
        id: deployment
