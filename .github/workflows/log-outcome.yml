name: Log Blizzard Outcome

# Prevent overlapping writers from racing to push the forecast archive
concurrency:
  group: blizzard-data-main
  queue: max
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      event_date:
        description: 'Prediction date (YYYY-MM-DD)'
        required: true
        type: string
      actual_outcome:
        description: 'Lock both calls before the result is public, or record the actual result'
        required: true
        type: choice
        options:
          - snow-day
          - school-open
          - no-school
          - lock-matchup
      no_school_reason:
        description: 'If no-school, why? (weekend, thanksgiving, winter-break, etc.)'
        required: false
        type: choice
        options:
          - ''
          - weekend
          - thanksgiving
          - winter-break
          - spring-break
          - teacher-day
          - mlk-day
          - presidents-day
          - memorial-day
          - other
      notes:
        description: 'Optional public notes shown in Past Calls and Git history. Use public information only.'
        required: false
        type: string
      blizzard_prediction:
        description: 'Blizzard AI prediction (0-100) - manual override when workflow misses it'
        required: false
        type: string
      rhs_prediction:
        description: 'Rockford High School prediction (0-100) - competition tracking'
        required: false
        type: string
      road_class:
        description: 'Optional Rockford-area observation for lock-matchup'
        type: choice
        options: ['', highway, county-road, local-street]
      road_condition:
        description: 'Reported road surface or treatment'
        type: choice
        options: ['', clear, wet, treated, icy, snow-covered]
      road_observed_at:
        description: 'Time the condition was observed, including UTC offset'
        type: string
      road_source:
        description: 'Public HTTPS link to the dated road report available at submission'
        type: string

permissions:
  contents: read

jobs:
  append-record:
    if: github.ref == 'refs/heads/main' && vars.BLIZZARD_AUTOMATION_WRITES_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Load canonical forecast data
        id: snapshot
        run: node build-tools/commit-data.mjs restore
      - name: Read the original submission time
        if: inputs.actual_outcome == 'lock-matchup'
        id: submission
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId })
            return data.created_at
      - name: Update validated ledger
        env:
          EVENT_DATE: ${{ inputs.event_date }}
          DISPATCH_DATA_BASE: ${{ steps.snapshot.outputs.sha }}
          SUBMISSION_TIME: ${{ steps.submission.outputs.result }}
          OUTCOME: ${{ inputs.actual_outcome }}
          NO_SCHOOL_REASON: ${{ inputs.no_school_reason }}
          NOTES: ${{ inputs.notes }}
          BLIZZARD_PREDICTION: ${{ inputs.blizzard_prediction }}
          ROAD_CLASS: ${{ inputs.road_class }}
          ROAD_CONDITION: ${{ inputs.road_condition }}
          ROAD_OBSERVED_AT: ${{ inputs.road_observed_at }}
          ROAD_SOURCE: ${{ inputs.road_source }}
          RHS_PREDICTION: ${{ inputs.rhs_prediction }}
        run: node build-tools/update-outcomes-ledger.mjs
      - name: Commit data without JSON rebasing
        id: commit
        if: ${{ success() }}
        env:
          DATA_BASE: ${{ steps.snapshot.outputs.sha }}
          BLIZZARD_AUTOMATION_WRITES_APPROVED: ${{ vars.BLIZZARD_AUTOMATION_WRITES_APPROVED }}
        run: node build-tools/commit-data.mjs
      - name: Request Pages deployment
        if: steps.commit.outputs.updated == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'deploy.yml', ref: 'main'
            })
