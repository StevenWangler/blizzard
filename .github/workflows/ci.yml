name: CI
on:
  pull_request:
  push:
    branches: [main, development]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check code PR for generated forecast data
        if: github.event_name == 'pull_request'
        run: |
          # A pull_request checkout is GitHub's test merge. Its first parent is the target branch.
          if ! git diff --exit-code --name-only HEAD^1 HEAD -- public/data/{outcomes,prediction,summary}.json; then
            echo "::error::Remove generated forecast files from the code PR. Record results through the outcome Actions on main."
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:dist
