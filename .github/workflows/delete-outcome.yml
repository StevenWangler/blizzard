name: Delete Blizzard Outcome

# Prevent overlapping writers from racing to push the forecast archive
concurrency:
  group: blizzard-data-main
  queue: max
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      event_date:
        description: 'Date to delete (YYYY-MM-DD)'
        required: true
        type: string
      confirm:
        description: 'Type "yes" to confirm deletion'
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete-record:
    if: github.ref == 'refs/heads/main' && vars.BLIZZARD_AUTOMATION_WRITES_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Load canonical forecast data
        id: snapshot
        run: node build-tools/commit-data.mjs restore
      - name: Update validated ledger
        env:
          EVENT_DATE: ${{ inputs.event_date }}
          CONFIRM: ${{ inputs.confirm }}
        run: node build-tools/delete-outcome.mjs
      - name: Commit data without JSON rebasing
        id: commit
        if: ${{ success() }}
        env:
          DATA_BASE: ${{ steps.snapshot.outputs.sha }}
          BLIZZARD_AUTOMATION_WRITES_APPROVED: ${{ vars.BLIZZARD_AUTOMATION_WRITES_APPROVED }}
        run: node build-tools/commit-data.mjs
      - name: Request Pages deployment
        if: steps.commit.outputs.updated == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner, repo: context.repo.repo,
              workflow_id: 'deploy.yml', ref: 'main'
            })
