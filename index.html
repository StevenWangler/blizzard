<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <title>Blizzard - Rockford, MI</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Blizzard - Snow Day Forecast for Rockford, MI" />
    <meta name="description" content="AI-powered snow day predictions for Rockford, Michigan. Get real-time forecasts, safety recommendations, and school closure predictions." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blizzardbot.ai/" />
    <meta property="og:title" content="Blizzard - Snow Day Forecast for Rockford, MI" />
    <meta property="og:description" content="AI-powered snow day predictions for Rockford, Michigan. Get real-time forecasts, safety recommendations, and school closure predictions." />
    <meta property="og:image" content="https://blizzardbot.ai/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://blizzardbot.ai/" />
    <meta property="twitter:title" content="Blizzard - Snow Day Forecast for Rockford, MI" />
    <meta property="twitter:description" content="AI-powered snow day predictions for Rockford, Michigan. Get real-time forecasts, safety recommendations, and school closure predictions." />
    <meta property="twitter:image" content="https://blizzardbot.ai/og-image.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0f172a" />
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blizzard" />
    
    <!-- Viewport with safe area support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <script>
      // Match the saved display mode before the station paints.
      let dark = true;
      try { dark = localStorage.getItem('spark_kv_dark-mode') !== 'false'; } catch {}
      document.documentElement.classList.toggle('dark', dark);
      document.documentElement.dataset.weatherMode = dark ? 'night' : 'day';
    </script>
    <link rel="preload" href="/fonts/vt323-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link href="/src/main.css" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
